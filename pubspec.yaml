name: medication_reminder
description: "A beautiful, offline-friendly medication reminder app bundled with a searchable medicine database."

publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking / storage
  dio: ^5.7.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # State management & local storage
  get: ^4.6.6
  get_storage: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0

  # Misc
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  share_plus: ^12.0.0
  package_info_plus: ^8.1.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
